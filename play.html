<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>在线游玩 - RetroHub</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="logo" href="index.html">Retro<span>Hub</span></a>
        <nav class="nav" aria-label="主导航">
          <a href="index.html">首页</a>
          <a href="games.html">游戏库</a>
          <a href="favorites.html">我的收藏</a>
          <a href="play.html" class="active">在线游玩</a>
          <a href="guides.html">教程</a>
          <a href="about.html">关于</a>
        </nav>
      </div>
    </header>

    <main class="container section">
      <h1>在线游玩（EmulatorJS）</h1>
      <p class="muted">
        选择模拟器核心后，可粘贴 ROM 远程地址或使用本地文件。演示配置默认不附带 ROM。
      </p>

      <section class="card form-card">
        <div class="form-grid">
          <label>
            模拟器核心
            <select id="coreSelect">
              <option value="nes">NES</option>
              <option value="snes">SNES</option>
              <option value="gba">GBA</option>
              <option value="gb">GB</option>
              <option value="psx">PS1</option>
            </select>
          </label>
          <label>
            ROM 远程地址（可选）
            <input id="romUrl" type="url" placeholder="https://example.com/game.nes" />
          </label>
          <label>
            本地 ROM 文件（可选）
            <input id="romFile" type="file" />
          </label>
        </div>
        <div class="hero-actions">
          <button id="launchBtn" class="btn primary" type="button">启动游戏</button>
        </div>
      </section>

      <section class="card">
        <h2>游戏窗口</h2>
        <div id="game"></div>
        <p id="status" class="muted">等待启动...</p>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-wrap">
        <small>EmulatorJS 来自开源项目，使用前请确认 ROM 合法来源。</small>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
