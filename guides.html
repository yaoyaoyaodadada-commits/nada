    <main class="container section">
      <h1>新手教程</h1>
      <div class="grid cards-2">
        <article class="card">
          <h2>1. 启动步骤</h2>
          <ol>
            <li>进入在线游玩页，选择核心（如 NES/GBA）。</li>
            <li>填写 ROM URL 或上传本地 ROM。</li>
            <li>点击“启动游戏”，等待加载。</li>
          </ol>
        </article>
        <article class="card">
          <h2>2. 常见问题</h2>
          <ul>
            <li>黑屏：请检查 ROM 格式是否与核心匹配。</li>
            <li>卡顿：关闭浏览器扩展或降低分辨率。</li>
            <li>无声音：确认浏览器已允许页面声音播放。</li>
          </ul>
        </article>
      </div>
    </main>

    <footer class="site-footer">
